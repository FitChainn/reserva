spring.application.name=reserva
server.port=8087

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_reserva?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cliente.service.url=${CLIENTE_SERVICE_URL:http://localhost:8081}
horario.service.url=${HORARIO_SERVICE_URL:http://localhost:8086}

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.fitchain=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20}: %msg%n
logging.file.name=logs/reserva.log
